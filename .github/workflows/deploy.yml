name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: javazone26-slides/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: javazone26-slides

      - name: Build
        run: npm run build -- --base /data-engineering-in-ai-wave/
        working-directory: javazone26-slides

      - name: SPA GitHub Pages fallback
        working-directory: javazone26-slides/dist
        run: |
          # 1. 404.html: redirect any unknown path to index.html with the path encoded in the query string.
          cat > 404.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                (function () {
                  var segmentCount = 1; // number of path segments to keep as base (repo name)
                  var l = window.location;
                  l.replace(
                    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                    l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
                    l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
                  );
                })();
              </script>
            </head>
            <body></body>
          </html>
          EOF

          # 2. Inject decoder into index.html <head> so the SPA sees the real path.
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text()
          snippet = """<script>
          (function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')}).join('?');window.history.replaceState(null,null,l.pathname.slice(0,-1)+d+l.hash);}}(window.location))
          </script>"""
          p.write_text(html.replace('<head>', '<head>\n' + snippet, 1))
          PYEOF

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: javazone26-slides/dist
